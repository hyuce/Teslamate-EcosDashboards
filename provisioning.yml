apiVersion: 1

# One Grafana folder per language. To install fewer languages, delete the
# providers you do not want. Each dashboard links to its other languages.
providers:
- name: 'TeslamateEcosDashboards'
  orgId: 1
  folder: Teslamate Ecos
  folderUid: teslamate_ecos
  type: file
  disableDeletion: false
  allowUiUpdates: true
  updateIntervalSeconds: 10
  options:
    path: /TeslamateEcosDashboards/dashboards/en
    foldersFromFilesStructure: false
